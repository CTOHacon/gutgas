user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 32M;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Access/error logs to stdout/stderr -> visible via `docker logs`
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # TLS is terminated by CloudPanel; tell Laravel the original scheme
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_read_timeout 120;
            # Laravel's preload Link header lists every page asset; the default
            # 4-8k buffer overflows on asset-heavy pages (502 "too big header").
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 32k;
        }

        # Long-cache built assets
        location ^~ /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Deny dotfiles (except ACME)
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
